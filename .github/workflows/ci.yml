name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/assetflow-ci.db
      AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
      AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      UPLOAD_DRIVER: local
      UPLOAD_DIR: ./storage/uploads
      CRON_SECRET: ci-worker-secret
      RUN_DB_TESTS: "true"
      TEST_DATABASE_URL: file:./prisma/assetflow-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: test-artifacts, path: "playwright-report/" }
