services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/assetflow.db
    command: ["sh", "-c", "pnpm db:deploy && pnpm db:seed && pnpm start"]
    ports: ["3000:3000"]
    volumes:
      ["assetflow_data:/app/data", "assetflow_uploads:/app/storage/uploads"]
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/assetflow.db
    command:
      [
        "sh",
        "-c",
        "while true; do node --import tsx src/jobs/worker.ts; sleep 60; done",
      ]
volumes:
  assetflow_data:
  assetflow_uploads:
